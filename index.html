<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Markdown Editor</title>
<meta name="description" content="A simple offline PWA for writing and previewing Reddit-flavored Markdown.">
<meta name="theme-color" content="#212529">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/css/bootstrap.min.css">
<style>
  /* Minimal glue — everything else is stock Bootstrap. */
  #screen-editor { height: 100vh; height: 100dvh; }
  .app-main { min-height: 0; }
  .app-pane { height: 100%; min-height: 0; }
  #editor {
    width: 100%; height: 100%; border: 0; resize: none;
    font-size: 16px; line-height: 1.6;
    font-family: var(--bs-font-monospace);
  }
  #editor:focus { outline: none; box-shadow: none; }
  #preview { height: 100%; overflow: auto; font-size: 16px; overflow-wrap: break-word; }
  /* NOTE: no overflow rules here — an overflow-x:auto toolbar clips
     Bootstrap dropdown menus (headings picker, overflow menu). */
  /* Preview typography (rendered markdown), sized for cards. */
  #preview h1 { font-size: 1.6rem; } #preview h2 { font-size: 1.4rem; }
  #preview h3 { font-size: 1.2rem; } #preview h4 { font-size: 1.05rem; }
  #preview h5 { font-size: 1rem; }   #preview h6 { font-size: .9rem; }
  #preview blockquote { border-left: 3px solid var(--bs-secondary); padding-left: .75rem; color: var(--bs-secondary-color); }
  #preview pre { white-space: pre-wrap; }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  /* FAB */
  #fab-insert {
    position: fixed;
    right: max(1rem, env(safe-area-inset-right, 1rem));
    bottom: calc(1rem + env(safe-area-inset-bottom, 0));
    width: 3.5rem; height: 3.5rem;
    font-size: 1.6rem; line-height: 1;
    border-radius: 50%;
    z-index: 1030;
    box-shadow: var(--bs-box-shadow);
  }
  .insert-grid .btn { min-height: 3rem; }
</style>
</head>
<body>

  <!-- ============================ HOME SCREEN ============================ -->
  <div id="screen-home">
    <nav class="navbar bg-dark navbar-dark py-2">
      <div class="container">
        <span class="navbar-brand mb-0"><span class="text-warning">⬢</span> Markdown Editor</span>
        <button class="btn btn-outline-light btn-sm ms-auto" id="btn-settings" type="button" title="Settings">⚙</button>
      </div>
    </nav>
    <div class="container py-3" style="max-width: 46rem;">
      <button class="btn btn-primary btn-lg w-100 mb-3" id="btn-new-doc" type="button">✎ New note</button>
      <ul class="nav nav-tabs" id="home-tabs" role="tablist">
        <li class="nav-item flex-fill" role="presentation">
          <button class="nav-link w-100 active" id="tab-notes" type="button" role="tab" aria-selected="true">Notes</button>
        </li>
        <li class="nav-item flex-fill" role="presentation">
          <button class="nav-link w-100" id="tab-templates" type="button" role="tab" aria-selected="false">Templates</button>
        </li>
      </ul>
      <div id="home-panel-notes" class="pt-3">
        <input class="form-control mb-3" type="search" id="doc-search"
               placeholder="Search notes…" aria-label="Search notes">
        <div id="doc-list" class="list-group"></div>
      </div>
      <div id="home-panel-templates" class="pt-3 d-none">
        <button class="btn btn-outline-primary w-100 mb-3" id="btn-new-template" type="button">+ New template</button>
        <div id="template-list" class="list-group"></div>
      </div>
    </div>
  </div>

  <!-- =========================== EDITOR SCREEN =========================== -->
  <div id="screen-editor" class="d-flex flex-column d-none">

    <!-- Top bar: back, pane toggle (phones), copy, kebab -->
    <nav class="navbar bg-dark navbar-dark py-1 flex-shrink-0">
      <div class="container-fluid gap-2 px-2">
        <button class="btn btn-outline-light btn-sm" id="btn-back" type="button" title="Back to notes">←</button>
        <div class="btn-group btn-group-sm flex-grow-1 mx-2 d-lg-none" role="group" aria-label="Switch panes">
          <button class="btn btn-outline-light flex-fill" id="tab-edit" type="button" aria-pressed="true">✎ Edit</button>
          <button class="btn btn-outline-light flex-fill" id="tab-preview" type="button" aria-pressed="false">👁 Preview</button>
        </div>
        <div class="flex-grow-1 d-none d-lg-block"></div>
        <span class="badge text-bg-warning d-none" id="badge-template">Template</span>
        <button class="btn btn-success btn-sm" id="btn-copy" type="button" title="Copy markdown">Copy</button>
        <div class="dropdown">
          <button class="btn btn-outline-light btn-sm" data-bs-toggle="dropdown" type="button" aria-label="More actions">⋮</button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><button class="dropdown-item" id="btn-copy-unicode" type="button">Copy as Unicode text</button></li>
            <li><button class="dropdown-item" id="btn-toggle-template" type="button">Save as template</button></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Work area -->
    <main class="container-fluid app-main d-flex flex-column flex-grow-1 px-0">
      <div class="row g-0 flex-grow-1 app-main">

        <!-- Editor column -->
        <div class="col-12 col-lg-6 d-flex flex-column app-pane" id="col-editor">
          <div class="card border-top-0 border-bottom-0 border-start-0 rounded-0 h-100 app-pane">
            <div class="card-header py-1 px-1">
              <div class="btn-toolbar md-toolbar gap-1" role="toolbar" aria-label="Formatting">
                <div class="btn-group btn-group-sm" role="group" aria-label="Inline formatting">
                  <button class="btn btn-outline-secondary" type="button" data-md="bold" title="Bold"><b>B</b></button>
                  <button class="btn btn-outline-secondary" type="button" data-md="italic" title="Italic"><i>I</i></button>
                  <button class="btn btn-outline-secondary" type="button" data-md="underline" title="Underline"><u>U</u></button>
                  <button class="btn btn-outline-secondary" type="button" data-md="strike" title="Strikethrough"><s>S</s></button>
                </div>
                <div class="btn-group btn-group-sm" role="group" aria-label="Link">
                  <button class="btn btn-outline-secondary" type="button" data-md="link" title="Link">🔗</button>
                </div>
                <div class="btn-group btn-group-sm" role="group" aria-label="Heading">
                  <button class="btn btn-outline-secondary" type="button" id="hdr-btn" title="Apply heading">H1</button>
                  <button class="btn btn-outline-secondary dropdown-toggle dropdown-toggle-split" type="button" data-bs-toggle="dropdown" aria-label="Choose heading level"><span class="visually-hidden">Choose heading</span></button>
                  <ul class="dropdown-menu">
                    <li><button class="dropdown-item" type="button" data-h="1">Heading 1</button></li>
                    <li><button class="dropdown-item" type="button" data-h="2">Heading 2</button></li>
                    <li><button class="dropdown-item" type="button" data-h="3">Heading 3</button></li>
                    <li><button class="dropdown-item" type="button" data-h="4">Heading 4</button></li>
                  </ul>
                </div>
                <div class="btn-group btn-group-sm" role="group" aria-label="Lists">
                  <button class="btn btn-outline-secondary" type="button" data-md="ul" title="Bulleted list">•</button>
                  <button class="btn btn-outline-secondary" type="button" data-md="ol" title="Ordered list">1.</button>
                </div>
                <div class="btn-group btn-group-sm" role="group" aria-label="Indentation">
                  <button class="btn btn-outline-secondary" type="button" data-md="indent" title="Indent (nest list)">⇥</button>
                  <button class="btn btn-outline-secondary" type="button" data-md="outdent" title="Outdent (un-nest)">⇤</button>
                </div>
                <div class="btn-group btn-group-sm" role="group" aria-label="Emoji">
                  <button class="btn btn-outline-secondary" type="button" data-md="emoji" title="Insert emoji">😀</button>
                </div>
                <div class="btn-group btn-group-sm" role="group" aria-label="Paste">
                  <button class="btn btn-outline-secondary" type="button" data-md="paste" title="Paste from clipboard">📋</button>
                </div>
                <div class="btn-group btn-group-sm" role="group" aria-label="More formatting">
                  <button class="btn btn-outline-secondary" type="button" data-bs-toggle="dropdown" aria-label="More formatting">⋯</button>
                  <ul class="dropdown-menu">
                    <li><button class="dropdown-item" type="button" data-md="code">&lt;/&gt; Inline code</button></li>
                    <li><button class="dropdown-item" type="button" data-md="sup">x² Superscript</button></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><button class="dropdown-item" type="button" id="btn-edit-table">▦ Edit table in builder…</button></li>
                  </ul>
                </div>
              </div>
            </div>
            <div class="card-body p-0 flex-grow-1 app-pane">
              <textarea id="editor" class="p-2 pb-5" spellcheck="true" autocapitalize="sentences"
                placeholder="# Note title&#10;&#10;The first line becomes the note's title. Everything is saved automatically."></textarea>
            </div>
          </div>
        </div>

        <!-- Preview column -->
        <div class="col-12 col-lg-6 d-flex flex-column app-pane d-none" id="col-preview">
          <div class="card border-top-0 border-bottom-0 border-end-0 rounded-0 h-100 app-pane">
            <div class="card-body p-0 flex-grow-1 app-pane">
              <div id="preview" class="p-3" aria-live="polite"></div>
            </div>
          </div>
        </div>

      </div>
    </main>

    <!-- FAB: insert block elements (hidden in preview mode) -->
    <button class="btn btn-primary" id="fab-insert" type="button" title="Insert">+</button>
  </div>

  <!-- Insert sheet (opened by the FAB) -->
  <div class="offcanvas offcanvas-bottom" tabindex="-1" id="insert-sheet" aria-labelledby="insert-sheet-label">
    <div class="offcanvas-header pb-1">
      <h6 class="offcanvas-title" id="insert-sheet-label">Insert</h6>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body pt-2">
      <div class="row g-2 insert-grid">
        <div class="col-6 col-sm-4"><button class="btn btn-outline-secondary w-100 h-100" type="button" data-md="table">▦ Table</button></div>
        <div class="col-6 col-sm-4"><button class="btn btn-outline-secondary w-100 h-100" type="button" data-md="quote">❝ Quote</button></div>
        <div class="col-6 col-sm-4"><button class="btn btn-outline-secondary w-100 h-100" type="button" data-md="spoiler">⛔ Spoiler</button></div>
        <div class="col-6 col-sm-4"><button class="btn btn-outline-secondary w-100 h-100" type="button" data-md="rule">— Divider</button></div>
      </div>
    </div>
  </div>

  <!-- Table size modal -->
  <div class="modal fade" id="modal-table" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Insert table</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body row g-3">
          <div class="col-6">
            <label class="form-label" for="tbl-cols">Columns</label>
            <input type="number" class="form-control" id="tbl-cols" min="1" max="20" value="3" inputmode="numeric">
          </div>
          <div class="col-6">
            <label class="form-label" for="tbl-rows">Data rows</label>
            <input type="number" class="form-control" id="tbl-rows" min="1" max="200" value="3" inputmode="numeric">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-outline-primary" id="btn-tbl-build">Build table…</button>
          <button type="button" class="btn btn-primary" id="btn-tbl-ok">Insert</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Quote text modal -->
  <div class="modal fade" id="modal-quote" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Insert quote</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <label class="form-label" for="quote-text">Text to quote</label>
          <textarea class="form-control" id="quote-text" rows="6" placeholder="Paste or write anything — every line becomes part of the quote."></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="btn-quote-ok">Insert</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Emoji sheet (opened from the toolbar) -->
  <div class="offcanvas offcanvas-bottom" tabindex="-1" id="emoji-sheet" aria-labelledby="emoji-sheet-label">
    <div class="offcanvas-header pb-1">
      <h6 class="offcanvas-title" id="emoji-sheet-label">Insert emoji</h6>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body pt-2">
      <div id="emoji-grid" class="row g-2"></div>
      <div class="d-grid mt-3">
        <button class="btn btn-outline-secondary btn-sm" id="btn-emoji-manage" type="button">⚙ Edit favorite emojis</button>
      </div>
    </div>
  </div>

  <!-- Spoiler text modal -->
  <div class="modal fade" id="modal-spoiler" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Insert spoiler</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <label class="form-label" for="spoiler-text">Text to hide</label>
          <textarea class="form-control" id="spoiler-text" rows="4" placeholder="This text will be revealed only when tapped on Reddit."></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="btn-spoiler-ok">Insert</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Settings modal -->
  <div class="modal fade" id="modal-settings" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Settings</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <label class="form-label" for="set-emojis">Favorite emojis</label>
          <textarea class="form-control" id="set-emojis" rows="5"
            placeholder="One emoji (or short string) per line, e.g.&#10;🚀&#10;🔥&#10;🐧"></textarea>
          <div class="form-text">These appear in the editor toolbar's 😀 picker while you write.</div>
          <hr>
          <label class="form-label mb-0"><strong>Data</strong></label>
          <div class="row g-2 mt-1">
            <div class="col-6">
              <button class="btn btn-outline-secondary w-100" id="btn-export" type="button">⬇ Export JSON</button>
            </div>
            <div class="col-6">
              <button class="btn btn-outline-secondary w-100" id="btn-import" type="button">⬆ Import JSON</button>
            </div>
          </div>
          <div class="form-text">Export downloads every note and template as JSON; import merges them in (exact duplicates skipped).</div>
          <input type="file" id="import-file" accept="application/json,.json" class="d-none">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="btn-set-ok">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toasts -->
  <div id="toast-holder" class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3"></div>

  <script src="vendor/js/bootstrap.bundle.min.js"></script>
  <!-- ?v pins cache/CDN version so index.html and app code never mismatch -->
  <script src="storage.js?v=14"></script>
  <script src="markdown.js?v=14"></script>
  <script src="tablebuilder.js?v=14"></script>
  <script src="app.js?v=14"></script>
</body>
</html>
