<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RedditMD — write Reddit-flavored Markdown</title>
<meta name="description" content="A simple offline PWA for writing and previewing Reddit-flavored Markdown.">
<meta name="theme-color" content="#212529">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/css/bootstrap.min.css">
<style>
  /* Minimal glue — everything else is stock Bootstrap. */
  #screen-editor { height: 100vh; height: 100dvh; }
  .app-main { min-height: 0; }
  .app-pane { height: 100%; min-height: 0; }
  #editor {
    width: 100%; height: 100%; border: 0; resize: none;
    font-size: 16px; line-height: 1.6;
    font-family: var(--bs-font-monospace);
  }
  #editor:focus { outline: none; box-shadow: none; }
  #preview { height: 100%; overflow: auto; font-size: 16px; overflow-wrap: break-word; }
  .md-toolbar { overflow-x: auto; }
  /* Preview typography (rendered markdown), sized for cards. */
  #preview h1 { font-size: 1.6rem; } #preview h2 { font-size: 1.4rem; }
  #preview h3 { font-size: 1.2rem; } #preview h4 { font-size: 1.05rem; }
  #preview h5 { font-size: 1rem; }   #preview h6 { font-size: .9rem; }
  #preview blockquote { border-left: 3px solid var(--bs-secondary); padding-left: .75rem; color: var(--bs-secondary-color); }
  #preview pre { white-space: pre-wrap; }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  /* FAB */
  #fab-insert {
    position: fixed;
    right: max(1rem, env(safe-area-inset-right, 1rem));
    bottom: calc(1rem + env(safe-area-inset-bottom, 0));
    width: 3.5rem; height: 3.5rem;
    font-size: 1.6rem; line-height: 1;
    border-radius: 50%;
    z-index: 1030;
    box-shadow: var(--bs-box-shadow);
  }
  .insert-grid .btn { min-height: 3rem; }
</style>
</head>
<body>

  <!-- ============================ HOME SCREEN ============================ -->
  <div id="screen-home">
    <nav class="navbar bg-dark navbar-dark py-2">
      <div class="container">
        <span class="navbar-brand mb-0"><span class="text-warning">⬢</span> RedditMD</span>
      </div>
    </nav>
    <div class="container py-3" style="max-width: 46rem;">
      <button class="btn btn-primary btn-lg w-100 mb-3" id="btn-new-doc" type="button">✎ New note</button>
      <ul class="nav nav-tabs" id="home-tabs" role="tablist">
        <li class="nav-item flex-fill" role="presentation">
          <button class="nav-link w-100 active" id="tab-notes" type="button" role="tab" aria-selected="true">Notes</button>
        </li>
        <li class="nav-item flex-fill" role="presentation">
          <button class="nav-link w-100" id="tab-templates" type="button" role="tab" aria-selected="false">Templates</button>
        </li>
      </ul>
      <div id="home-panel-notes" class="pt-3">
        <input class="form-control mb-3" type="search" id="doc-search"
               placeholder="Search notes…" aria-label="Search notes">
        <div id="doc-list" class="list-group"></div>
      </div>
      <div id="home-panel-templates" class="pt-3 d-none">
        <button class="btn btn-outline-primary w-100 mb-3" id="btn-new-template" type="button">+ New template</button>
        <div id="template-list" class="list-group"></div>
      </div>
    </div>
  </div>

  <!-- =========================== EDITOR SCREEN =========================== -->
  <div id="screen-editor" class="d-flex flex-column d-none">

    <!-- Top bar: back, live title, copy, kebab -->
    <nav class="navbar bg-dark navbar-dark py-1 flex-shrink-0">
      <div class="container-fluid gap-2 px-2">
        <button class="btn btn-outline-light btn-sm" id="btn-back" type="button" title="Back to notes">←</button>
        <span class="navbar-text text-truncate flex-grow-1" id="title-live">Note</span>
        <span class="badge text-bg-warning d-none" id="badge-template">Template</span>
        <button class="btn btn-success btn-sm" id="btn-copy" type="button" title="Copy markdown">📋<span class="d-none d-sm-inline ms-1">Copy</span></button>
        <div class="dropdown">
          <button class="btn btn-outline-light btn-sm" data-bs-toggle="dropdown" type="button" aria-label="More actions">⋮</button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><button class="dropdown-item" id="btn-copy-unicode" type="button">Copy as Unicode text</button></li>
            <li><button class="dropdown-item" id="btn-toggle-template" type="button">Save as template</button></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Edit / Preview tabs (phones) -->
    <ul class="nav nav-tabs justify-content-center d-lg-none flex-shrink-0 pt-1 px-2" id="view-tabs" role="tablist">
      <li class="nav-item flex-fill" role="presentation">
        <button class="nav-link w-100" id="tab-edit" type="button" role="tab" aria-selected="true">✎ Edit</button>
      </li>
      <li class="nav-item flex-fill" role="presentation">
        <button class="nav-link w-100" id="tab-preview" type="button" role="tab" aria-selected="false">👁 Preview</button>
      </li>
    </ul>

    <!-- Work area -->
    <main class="container-fluid app-main d-flex flex-column flex-grow-1 px-0">
      <div class="row g-0 flex-grow-1 app-main">

        <!-- Editor column -->
        <div class="col-12 col-lg-6 d-flex flex-column app-pane" id="col-editor">
          <div class="card border-top-0 border-bottom-0 border-start-0 rounded-0 h-100 app-pane">
            <div class="card-header py-1 px-1">
              <div class="btn-toolbar md-toolbar gap-1" role="toolbar" aria-label="Inline formatting">
                <div class="btn-group btn-group-sm" role="group" aria-label="Inline formatting">
                  <button class="btn btn-outline-secondary" type="button" data-md="bold" title="Bold"><b>B</b></button>
                  <button class="btn btn-outline-secondary" type="button" data-md="italic" title="Italic"><i>I</i></button>
                  <button class="btn btn-outline-secondary" type="button" data-md="underline" title="Underline"><u>U</u></button>
                  <button class="btn btn-outline-secondary" type="button" data-md="strike" title="Strikethrough"><s>S</s></button>
                  <button class="btn btn-outline-secondary" type="button" data-md="code" title="Inline code">&lt;/&gt;</button>
                  <button class="btn btn-outline-secondary" type="button" data-md="link" title="Link">🔗</button>
                  <button class="btn btn-outline-secondary" type="button" data-md="sup" title="Superscript">^</button>
                </div>
              </div>
            </div>
            <div class="card-body p-0 flex-grow-1 app-pane">
              <textarea id="editor" class="p-2" spellcheck="true" autocapitalize="sentences"
                placeholder="# Note title&#10;&#10;The first line becomes the note's title. Everything is saved automatically."></textarea>
            </div>
          </div>
        </div>

        <!-- Preview column -->
        <div class="col-12 col-lg-6 d-flex flex-column app-pane d-none" id="col-preview">
          <div class="card border-top-0 border-bottom-0 border-end-0 rounded-0 h-100 app-pane">
            <div class="card-header py-1 d-flex flex-wrap gap-2 align-items-center">
              <div class="btn-group btn-group-sm" role="group" aria-label="Preview mode">
                <button class="btn btn-outline-secondary active" type="button" id="mode-render">Reddit preview</button>
                <button class="btn btn-outline-secondary" type="button" id="mode-raw">Raw</button>
              </div>
            </div>
            <div class="card-body p-0 flex-grow-1 app-pane">
              <div id="preview" class="p-3" aria-live="polite"></div>
            </div>
          </div>
        </div>

      </div>
    </main>

    <!-- FAB: insert block elements -->
    <button class="btn btn-primary" id="fab-insert" type="button" title="Insert">+</button>
  </div>

  <!-- Insert sheet (opened by the FAB) -->
  <div class="offcanvas offcanvas-bottom" tabindex="-1" id="insert-sheet" aria-labelledby="insert-sheet-label">
    <div class="offcanvas-header pb-1">
      <h6 class="offcanvas-title" id="insert-sheet-label">Insert</h6>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body pt-2">
      <div class="row g-2 insert-grid">
        <div class="col-6 col-sm-4"><button class="btn btn-outline-secondary w-100 h-100" type="button" data-md="table">▦ Table</button></div>
        <div class="col-6 col-sm-4"><button class="btn btn-outline-secondary w-100 h-100" type="button" data-md="ul">• Bulleted list</button></div>
        <div class="col-6 col-sm-4"><button class="btn btn-outline-secondary w-100 h-100" type="button" data-md="ol">1. Ordered list</button></div>
        <div class="col-6 col-sm-4"><button class="btn btn-outline-secondary w-100 h-100" type="button" data-md="quote">❝ Quote</button></div>
        <div class="col-6 col-sm-4"><button class="btn btn-outline-secondary w-100 h-100" type="button" data-md="spoiler">⛔ Spoiler</button></div>
        <div class="col-6 col-sm-4"><button class="btn btn-outline-secondary w-100 h-100" type="button" data-md="rule">— Divider</button></div>
        <div class="col-3 col-sm-2"><button class="btn btn-outline-secondary w-100 h-100" type="button" data-md="h1">H1</button></div>
        <div class="col-3 col-sm-2"><button class="btn btn-outline-secondary w-100 h-100" type="button" data-md="h2">H2</button></div>
        <div class="col-3 col-sm-2"><button class="btn btn-outline-secondary w-100 h-100" type="button" data-md="h3">H3</button></div>
        <div class="col-3 col-sm-2"><button class="btn btn-outline-secondary w-100 h-100" type="button" data-md="h4">H4</button></div>
      </div>
    </div>
  </div>

  <!-- Toasts -->
  <div id="toast-holder" class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3"></div>

  <script src="vendor/js/bootstrap.bundle.min.js"></script>
  <script src="storage.js"></script>
  <script src="markdown.js"></script>
  <script src="app.js"></script>
</body>
</html>
