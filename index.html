<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RedditMD — write Reddit-flavored Markdown</title>
<meta name="description" content="A simple offline PWA for writing and previewing Reddit-flavored Markdown.">
<meta name="theme-color" content="#212529">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/css/bootstrap.min.css">
<style>
  /* Minimal glue only — everything else is stock Bootstrap. */
  .app-shell { height: 100vh; height: 100dvh; }
  .app-main { min-height: 0; }
  .app-pane { height: 100%; min-height: 0; }
  #editor {
    width: 100%; height: 100%; border: 0; resize: none;
    font-size: 16px; line-height: 1.6;
    font-family: var(--bs-font-monospace);
  }
  #editor:focus { outline: none; box-shadow: none; }
  #preview { height: 100%; overflow: auto; font-size: 16px; overflow-wrap: break-word; }
  .md-toolbar { overflow-x: auto; }
  /* Preview typography (rendered markdown), sized for cards. */
  #preview h1 { font-size: 1.6rem; } #preview h2 { font-size: 1.4rem; }
  #preview h3 { font-size: 1.2rem; } #preview h4 { font-size: 1.05rem; }
  #preview h5 { font-size: 1rem; }   #preview h6 { font-size: .9rem; }
  #preview blockquote { border-left: 3px solid var(--bs-secondary); padding-left: .75rem; color: var(--bs-secondary-color); }
  #preview pre { white-space: pre-wrap; }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  #doc-list, #template-list { max-height: 50vh; }
  @media (min-width: 992px) { #doc-list, #template-list { max-height: none; } }
</style>
</head>
<body class="d-flex flex-column app-shell bg-body-tertiary">
  <!-- ================================ NAVBAR ================================ -->
  <nav class="navbar navbar-expand bg-dark navbar-dark py-1 flex-shrink-0">
    <div class="container-fluid gap-1 gap-sm-2 px-2">
      <span class="navbar-brand mb-0 me-0 fs-6"><span class="text-warning">⬢</span><span class="d-none d-sm-inline"> RedditMD</span></span>
      <button class="btn btn-outline-light btn-sm" id="btn-docs" type="button" title="Documents">☰</button>
      <button class="btn btn-outline-light btn-sm" id="btn-templates" type="button" title="Templates">✦</button>
      <input id="doc-title" class="form-control form-control-sm w-auto flex-grow-1 bg-dark text-white border-secondary"
             type="text" placeholder="Untitled document" aria-label="Document title" autocomplete="off">
      <button class="btn btn-warning btn-sm" id="btn-save" type="button" title="Save">💾<span class="d-none d-sm-inline ms-1">Save</span></button>
      <button class="btn btn-success btn-sm" id="btn-copy" type="button" title="Copy markdown">📋<span class="d-none d-sm-inline ms-1">Copy</span></button>
    </div>
  </nav>

  <!-- ========================= EDIT / PREVIEW TABS ========================== -->
  <ul class="nav nav-tabs justify-content-center d-lg-none flex-shrink-0 pt-1 px-2 bg-body-tertiary" id="view-tabs" role="tablist">
    <li class="nav-item flex-fill">
      <button class="nav-link w-100" id="tab-edit" type="button" role="tab" aria-selected="true">✎ Edit</button>
    </li>
    <li class="nav-item flex-fill">
      <button class="nav-link w-100" id="tab-preview" type="button" role="tab" aria-selected="false">👁 Preview</button>
    </li>
  </ul>

  <!-- ============================== WORK AREA =============================== -->
  <main class="container-fluid app-main d-flex flex-column flex-grow-1 px-0">
    <div class="row g-0 flex-grow-1 app-main">

      <!-- Editor column -->
      <div class="col-12 col-lg-6 d-flex flex-column app-pane" id="col-editor">
        <div class="card border-top-0 border-bottom-0 border-start-0 rounded-0 h-100 app-pane">
          <div class="card-header py-1 px-1">
            <div class="btn-toolbar md-toolbar gap-1" role="toolbar" aria-label="Markdown helpers">
              <div class="btn-group btn-group-sm" role="group" aria-label="Inline formatting">
                <button class="btn btn-outline-secondary" type="button" data-md="bold" title="Bold"><b>B</b></button>
                <button class="btn btn-outline-secondary" type="button" data-md="italic" title="Italic"><i>I</i></button>
                <button class="btn btn-outline-secondary" type="button" data-md="underline" title="Underline"><u>U</u></button>
                <button class="btn btn-outline-secondary" type="button" data-md="strike" title="Strikethrough"><s>S</s></button>
                <button class="btn btn-outline-secondary" type="button" data-md="code" title="Inline code">&lt;/&gt;</button>
                <button class="btn btn-outline-secondary" type="button" data-md="link" title="Link">🔗</button>
                <button class="btn btn-outline-secondary" type="button" data-md="quote" title="Quote">❝</button>
                <button class="btn btn-outline-secondary" type="button" data-md="spoiler" title="Spoiler">⛔</button>
              </div>
              <div class="btn-group btn-group-sm" role="group" aria-label="Headings">
                <button class="btn btn-outline-secondary" type="button" data-md="h1" title="Heading 1">H1</button>
                <button class="btn btn-outline-secondary" type="button" data-md="h2" title="Heading 2">H2</button>
                <button class="btn btn-outline-secondary" type="button" data-md="h3" title="Heading 3">H3</button>
                <button class="btn btn-outline-secondary" type="button" data-md="h4" title="Heading 4">H4</button>
              </div>
              <div class="btn-group btn-group-sm" role="group" aria-label="Lists and tables">
                <button class="btn btn-outline-secondary" type="button" data-md="ul" title="Bulleted list">•</button>
                <button class="btn btn-outline-secondary" type="button" data-md="ol" title="Ordered list">1.</button>
                <button class="btn btn-outline-secondary" type="button" data-md="rule" title="Horizontal rule">—</button>
                <button class="btn btn-outline-secondary" type="button" data-md="table" title="Insert table">▦</button>
              </div>
              <div class="btn-group btn-group-sm" role="group" aria-label="View">
                <button class="btn btn-outline-secondary" type="button" id="btn-wrap" title="Toggle soft wrap">↩</button>
              </div>
            </div>
          </div>
          <div class="card-body p-0 flex-grow-1 app-pane">
            <textarea id="editor" class="p-2" spellcheck="true" autocapitalize="sentences"
              placeholder="# Your post title&#10;&#10;Write Reddit-flavored Markdown here…"></textarea>
          </div>
        </div>
      </div>

      <!-- Preview column -->
      <div class="col-12 col-lg-6 d-flex flex-column app-pane d-none" id="col-preview">
        <div class="card border-top-0 border-bottom-0 border-end-0 rounded-0 h-100 app-pane">
          <div class="card-header py-1 d-flex flex-wrap gap-2 align-items-center">
            <div class="btn-group btn-group-sm" role="group" aria-label="Preview mode">
              <button class="btn btn-outline-secondary active" type="button" id="mode-render">Reddit preview</button>
              <button class="btn btn-outline-secondary" type="button" id="mode-raw">Raw</button>
            </div>
            <button class="btn btn-outline-success btn-sm ms-auto" type="button" id="btn-copy-preview" hidden
              title="Copy as Unicode-formatted plain text">Copy unicode</button>
          </div>
          <div class="card-body p-0 flex-grow-1 app-pane">
            <div id="preview" class="p-3" aria-live="polite"></div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- ===================== OFFCANVAS: DOCS ===================== -->
  <div class="offcanvas offcanvas-start" tabindex="-1" id="docs-canvas" aria-labelledby="docs-canvas-label">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="docs-canvas-label">Saved documents</h5>
      <div class="d-flex gap-2">
        <button class="btn btn-sm btn-outline-primary" id="btn-new-doc" type="button">+ New</button>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>
    </div>
    <div class="offcanvas-body d-flex flex-column gap-3">
      <input class="form-control" type="search" id="doc-search" placeholder="Search titles & content…" aria-label="Search documents">
      <div id="template-picker">
        <label class="form-label small mb-1" for="new-from-template"><strong>Create from template</strong></label>
        <select class="form-select" id="new-from-template">
          <option value="">— pick a template —</option>
        </select>
      </div>
      <div id="doc-list" class="list-group list-group-flush overflow-auto"></div>
    </div>
  </div>

  <!-- ===================== OFFCANVAS: TEMPLATES ===================== -->
  <div class="offcanvas offcanvas-start" tabindex="-1" id="templates-canvas" aria-labelledby="templates-canvas-label">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="templates-canvas-label">Templates</h5>
      <div class="d-flex gap-2">
        <button class="btn btn-sm btn-outline-primary" id="btn-new-template" type="button">+ New</button>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>
    </div>
    <div class="offcanvas-body d-flex flex-column gap-3">
      <p class="small text-muted mb-0">Templates appear in the document picker so you can start a new post from one and just fill it in.</p>
      <div id="template-list" class="list-group list-group-flush overflow-auto"></div>
    </div>
  </div>

  <!-- ===================== MODAL: PROMPT ===================== -->
  <div class="modal fade" id="modal-prompt" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modal-prompt-title">Title</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <label class="form-label" for="modal-prompt-input" id="modal-prompt-label">Value</label>
          <input type="text" class="form-control" id="modal-prompt-input" autocomplete="off">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="modal-prompt-ok">OK</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===================== TOASTS ===================== -->
  <div id="toast-holder" class="toast-container toast-container position-fixed bottom-0 start-50 translate-middle-x p-3"></div>

  <script src="vendor/js/bootstrap.bundle.min.js"></script>
  <script src="storage.js"></script>
  <script src="markdown.js"></script>
  <script src="app.js"></script>
</body>
</html>
