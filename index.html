<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RedditMD — write Reddit-flavored Markdown</title>
<meta name="description" content="A simple offline PWA for writing and previewing Reddit-flavored Markdown.">
<meta name="theme-color" content="#1a1a2e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
<style>
  html, body { height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    background: #f2f3f7;
    overflow: hidden;
    padding-left: env(safe-area-inset-left, 0);
    padding-right: env(safe-area-inset-right, 0);
  }
  #topbar { flex: 0 0 auto; }

  .navbar { background: #1a1a2e; }
  #doc-title {
    font-size: 16px;               /* ≥16px: prevents iOS focus zoom */
    min-width: 0;
  }
  .topbar-btn {
    min-width: 44px; min-height: 40px;   /* touch targets */
    font-size: 15px;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  /* Edit/Preview tab strip */
  #view-tabs {
    background: #1a1a2e;
    padding: 0 .5rem;
  }
  #view-tabs .nav-link {
    color: rgba(255,255,255,.55);
    border: 0;
    border-bottom: 3px solid transparent;
    border-radius: 0;
    padding: .45rem .85rem;
    font-size: 16px;
    min-height: 42px;
  }
  #view-tabs .nav-link.active {
    color: #fff;
    border-bottom-color: #ff4500;
    background: transparent;
  }

  /* ---------- editor / preview panes ---------- */
  #work { flex: 1 1 auto; min-height: 0; }
  #editor {
    width: 100%; height: 100%;
    resize: none; border: 0;
    font-size: 16px;
    line-height: 1.6;
    font-family: SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    padding: .65rem .75rem;
  }
  #editor:focus { outline: none; box-shadow: none; }
  #preview {
    height: 100%;
    overflow: auto;
    background: #fff;
    border: 0;
    padding: .85rem .9rem 2rem;
    font-size: 16px;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  .preview-pane th, .preview-pane td { border: 1px solid #dee2e6; }
  .preview-pane table { width: max-content; min-width: 100%; }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  #preview pre { white-space: pre-wrap; }

  /* ---------- markdown toolbar: single scrollable row ---------- */
  .md-toolbar {
    display: flex;
    gap: .3rem;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding: .35rem .5rem;
    background: #fff;
    border-bottom: 1px solid var(--bs-border-color);
  }
  .md-toolbar::-webkit-scrollbar { display: none; }
  .md-toolbar .btn {
    flex: 0 0 auto;
    min-width: 42px;
    line-height: 1;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- mobile: tabbed panes ---------- */
  #col-editor, #col-preview { height: 100%; min-width: 0; }
  body.show-preview #col-editor { display: none; }
  body.show-preview #col-preview { display: flex; }
  body:not(.show-preview) #col-preview { display: none; }

  /* ---------- desktop: side-by-side, tabs hidden ---------- */
  @media (min-width: 992px) {
    #view-tabs { display: none; }
    body.show-preview #col-editor { display: flex; }
    body.show-preview #col-preview { display: flex; }
    body:not(.show-preview) #col-preview { display: flex; }
    #editor { border-right: 1px solid var(--bs-border-color); }
  }

  /* ---------- offcanvas: bottom sheets on phones ---------- */
  .doc-row { padding: .7rem .5rem; }
  .doc-row .btn { min-width: 44px; }
  #toast-holder {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: 1rem;
    width: min(92vw, 26rem);
    z-index: 1090;
  }
</style>
</head>
<body class="">
  <!-- ===================== TOP BAR ===================== -->
  <nav class="navbar navbar-dark py-1" id="topbar" aria-label="Top bar">
    <div class="container-fluid px-2 gap-2">
      <button class="btn btn-outline-light topbar-btn" id="btn-docs" type="button" title="Documents">☰</button>
      <button class="btn btn-outline-light topbar-btn" id="btn-templates" type="button" title="Templates">✦</button>
      <input id="doc-title" class="form-control flex-grow-1 bg-dark text-white border-secondary"
             type="text" placeholder="Untitled document" aria-label="Document title" autocomplete="off">
      <button class="btn btn-warning topbar-btn" id="btn-save" type="button" title="Save">💾</button>
      <button class="btn btn-success topbar-btn" id="btn-copy" type="button" title="Copy markdown">📋</button>
    </div>
  </nav>

  <!-- ===================== EDIT / PREVIEW TABS ===================== -->
  <ul class="nav nav-fill" id="view-tabs" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" id="tab-edit" type="button" role="tab" aria-selected="true">✎ Edit</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="tab-preview" type="button" role="tab" aria-selected="false">👁 Preview</button>
    </li>
  </ul>

  <!-- ===================== WORK AREA ===================== -->
  <div id="work" class="container-fluid px-0">
    <div class="row g-0" id="row-main">
      <div class="col-lg-6" id="col-editor">
        <div class="pane editor-pane d-flex flex-column" style="height:100%">
          <div class="md-toolbar" role="toolbar" aria-label="Markdown helpers">
            <button class="btn btn-outline-secondary btn-sm" type="button" data-md="bold" title="Bold"><b>B</b></button>
            <button class="btn btn-outline-secondary btn-sm" type="button" data-md="italic" title="Italic"><i>I</i></button>
            <button class="btn btn-outline-secondary btn-sm" type="button" data-md="underline" title="Underline"><u>U</u></button>
            <button class="btn btn-outline-secondary btn-sm" type="button" data-md="strike" title="Strikethrough"><s>S</s></button>
            <button class="btn btn-outline-secondary btn-sm" type="button" data-md="code" title="Inline code">&lt;/&gt;</button>
            <button class="btn btn-outline-secondary btn-sm" type="button" data-md="link" title="Link">🔗</button>
            <button class="btn btn-outline-secondary btn-sm" type="button" data-md="quote" title="Quote">❝</button>
            <button class="btn btn-outline-secondary btn-sm" type="button" data-md="spoiler" title="Spoiler">⛔</button>
            <button class="btn btn-outline-secondary btn-sm" type="button" data-md="h1" title="Heading 1">H1</button>
            <button class="btn btn-outline-secondary btn-sm" type="button" data-md="h2" title="Heading 2">H2</button>
            <button class="btn btn-outline-secondary btn-sm" type="button" data-md="h3" title="Heading 3">H3</button>
            <button class="btn btn-outline-secondary btn-sm" type="button" data-md="h4" title="Heading 4">H4</button>
            <button class="btn btn-outline-secondary btn-sm" type="button" data-md="ul" title="Bulleted list">• List</button>
            <button class="btn btn-outline-secondary btn-sm" type="button" data-md="ol" title="Ordered list">1. List</button>
            <button class="btn btn-outline-secondary btn-sm" type="button" data-md="rule" title="Horizontal rule">—</button>
            <button class="btn btn-outline-secondary btn-sm" type="button" data-md="table" title="Insert table">▦ Table</button>
            <button class="btn btn-outline-secondary btn-sm" type="button" id="btn-wrap" title="Toggle soft wrap">↩</button>
          </div>
          <textarea id="editor" class="form-control flex-grow-1" spellcheck="true" autocapitalize="sentences"
            placeholder="# Your post title&#10;&#10;Write Reddit-flavored Markdown here…"></textarea>
        </div>
      </div>
      <div class="col-lg-6" id="col-preview">
        <div class="pane preview-pane d-flex flex-column" style="height:100%">
          <div class="d-flex gap-2 px-2 py-1 bg-white border-bottom align-items-center flex-wrap">
            <div class="btn-group btn-group-sm" role="group" aria-label="Preview mode">
              <button class="btn btn-outline-secondary active" type="button" id="mode-render">Reddit preview</button>
              <button class="btn btn-outline-secondary" type="button" id="mode-raw">Raw</button>
            </div>
            <button class="btn btn-outline-success btn-sm ms-auto" type="button" id="btn-copy-preview" hidden
              title="Copy as Unicode-formatted plain text">Copy unicode</button>
          </div>
          <div id="preview" class="flex-grow-1" aria-live="polite"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===================== OFFCANVAS: DOCS ===================== -->
  <div class="offcanvas offcanvas-bottom offcanvas-md offcanvas-start" tabindex="-1" id="docs-canvas" aria-labelledby="docs-canvas-label" style="--bs-offcanvas-height:78vh;">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="docs-canvas-label">Saved documents</h5>
      <div class="d-flex gap-2">
        <button class="btn btn-sm btn-outline-primary" id="btn-new-doc" type="button">+ New</button>
        <button class="btn btn-sm btn-outline-secondary" data-bs-dismiss="offcanvas" type="button">✕</button>
      </div>
    </div>
    <div class="offcanvas-body d-flex flex-column gap-3">
      <div class="input-group input-group-sm">
        <input class="form-control" type="search" id="doc-search" placeholder="Search titles & content…" aria-label="Search documents">
      </div>
      <div id="template-picker">
        <label class="form-label small mb-1" for="new-from-template"><strong>Create from template</strong></label>
        <select class="form-select" id="new-from-template">
          <option value="">— pick a template —</option>
        </select>
      </div>
      <div id="doc-list" class="list-group list-group-flush overflow-auto"></div>
    </div>
  </div>

  <!-- ===================== OFFCANVAS: TEMPLATES ===================== -->
  <div class="offcanvas offcanvas-bottom offcanvas-md offcanvas-start" tabindex="-1" id="templates-canvas" aria-labelledby="templates-canvas-label" style="--bs-offcanvas-height:78vh;">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="templates-canvas-label">Templates</h5>
      <div class="d-flex gap-2">
        <button class="btn btn-sm btn-outline-primary" id="btn-new-template" type="button">+ New</button>
        <button class="btn btn-sm btn-outline-secondary" data-bs-dismiss="offcanvas" type="button">✕</button>
      </div>
    </div>
    <div class="offcanvas-body d-flex flex-column gap-3">
      <p class="small text-muted mb-0">Templates appear in the document picker so you can start a new post from one and just fill it in.</p>
      <div id="template-list" class="list-group list-group-flush overflow-auto"></div>
    </div>
  </div>

  <div class="modal fade" id="modal-prompt" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modal-prompt-title">Title</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <label class="form-label" for="modal-prompt-input" id="modal-prompt-label">Value</label>
          <input type="text" class="form-control" id="modal-prompt-input" autocomplete="off">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="modal-prompt-ok">OK</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-holder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="storage.js"></script>
  <script src="markdown.js"></script>
  <script src="app.js"></script>
</body>
</html>
